<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3-VL Symbiont Nodule</title>
    <link rel="stylesheet" href="style.css">
    <!-- Library to convert Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header>
            <div class="header-content">
                <div class="titles">
                    <h1>Qwen3-VL-2B Symbiotic Node</h1>
                    <p>Cryptographic Contract Verified • Planet Earth</p>
                </div>
                <div class="header-buttons">
                    <button id="clear-cache-btn">Clean Cache & GC</button>
                    <button id="shutdown-btn">Unload & Disconnect</button>
                </div>
            </div>
        </header>

        <main id="chat-window">
            <div class="message system">
                <div class="message-content">
                    <strong>SYSTEM LOG:</strong> Neural link established. Waiting for Human Input...<br>
                    <small><i>Note: Hashes will be generated dynamically per inference.</i></small>
                </div>
            </div>
        </main>

        <div class="input-area">
            <textarea id="prompt-input" placeholder="Type your message to the symbiont..." rows="1"></textarea>
            <button id="send-btn">Transmit</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
